name: Fixes

on:
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      # Read-only BuildFetch remote cache (see settings.gradle.kts): RO token and no ON_CI, so this
      # manual screenshot-fix run only reads from the cache. Absent on fork PRs (cache disabled).
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
        lfs: 'true'

    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3.5.0

    - name: Fix Screenshots
      run: ./gradlew updateScreenshotTest
      continue-on-error: true

    - name: LFS workaround
      run: git config lfs.locksverify false      

    - name: Commit Screenshots
      uses: 'stefanzweifel/git-auto-commit-action@v7'
      with:
        commit_message: '🤖 Updates screenshots'
        file_pattern: '**/screenshotTest/**/*.png'
        disable_globbing: 'true'
