name: iOS CI

on:
  pull_request:
  # Also run on main so gradle/actions/setup-gradle can seed the dependency and
  # local build caches that PR runs then restore (Actions caches are only saved
  # from the default branch and shared to PRs from there).
  push:
    branches: [ main ]

# Cancel any current or previous job from the same PR (or main run)
concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect iOS-relevant changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      # Main builds always run to seed caches. Pull requests first use a cheap
      # Linux job to avoid reserving a macOS runner for platform-only changes.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Decide whether to build iOS
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ios-changes.py "$BASE_SHA" "$HEAD_SHA"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      # Read-only BuildFetch remote cache (see settings.gradle.kts): RO token and no ON_CI, so the
      # Kotlin/Native compile Gradle runs (invoked by xcodebuild) only read from the cache. Absent
      # on fork PRs, which disables the cache there.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      # Restores the Gradle dependency cache and local build cache across runs so the
      # Kotlin/Native framework compile (invoked by xcodebuild via ./gradlew
      # :shared:embedAndSignAppleFrameworkForXcode) resolves from cache on unchanged code.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache KMP libraries
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-v1-${{ hashFiles('**/libs.versions.toml') }}

      - name: Cache SPM downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          # Package.resolved is not committed, so include the Xcode project's
          # package requirements instead of producing one constant empty hash.
          key: ${{ runner.os }}-spm-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set Xcode Version 26.6
        shell: bash
        run: |
          xcodes select 26.6

      # Matching a destination by device name intermittently times out on the hosted runners:
      # xcodebuild waits ~60s and then reports "Unable to find a device matching ... iPhone 17
      # Pro" even though the same image builds fine on other runs. Resolve a concrete simulator
      # up front with simctl and address it by UDID instead, so the tests never depend on
      # xcodebuild's own name matching.
      - name: Select iOS Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          devices = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for entry in entries:
                  if entry.get("isAvailable") and entry["name"].startswith("iPhone"):
                      candidates.append((runtime, entry["name"], entry["udid"]))

          if not candidates:
              sys.exit("no available iPhone simulator on this runner")

          # Prefer the device the workflow used to pin, otherwise just take one that exists.
          preferred = [c for c in candidates if c[1] == "iPhone 17 Pro"]
          runtime, name, udid = (preferred or candidates)[0]
          print(f"{name} ({runtime}) -> {udid}", file=sys.stderr)
          print(udid)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Build once for testing (app + test targets) on the simulator, then run the tests
      # without rebuilding. Simulator builds skip code signing / provisioning entirely.
      # Both steps target the one resolved simulator. A generic destination
      # ('generic/platform=iOS Simulator') looks tempting here but builds a universal binary,
      # asking Gradle for x86_64 as well - and this project drops iosX64, so that fails with
      # "Xcode Requested Architecture Not Configured in Gradle". A concrete arm64 simulator
      # keeps ARCHS single-arch.
      - name: Build iOS app for testing
        run: xcodebuild build-for-testing -project iosApp/iosApp.xcodeproj -configuration Debug -scheme iosApp -sdk iphonesimulator -destination "id=${{ steps.simulator.outputs.udid }}"

      - name: Run iOS unit tests
        run: xcodebuild test-without-building -project iosApp/iosApp.xcodeproj -configuration Debug -scheme iosApp -sdk iphonesimulator -destination "id=${{ steps.simulator.outputs.udid }}" -test-timeouts-enabled YES
