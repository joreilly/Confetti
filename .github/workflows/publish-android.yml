name: Publish Android

on:
  push:
    branches:
      - 'main'
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # BuildFetch remote cache (see settings.gradle.kts). This is a trusted main-branch run, so
      # ON_CI=true: it pushes freshly-executed task outputs to the remote, seeding the cache that
      # PR and developer builds read from.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        # setup-gradle@v6 (matches compose-preview.yml / design-artifacts.yml): the deprecated
        # gradle-build-action@v3.5.0 fails on Gradle 9.6.1 in its cache-cleanup init script
        # ("write-only property 'removeUnusedEntriesOlderThan'").
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build
        run: |
          ./gradlew :androidApp:assembleGithubRelease

      - uses: actions/upload-artifact@v7
        with:
          name: androidApp-githubRelease.apk
          path: androidApp/build/outputs/apk/release/androidApp-githubRelease.apk
