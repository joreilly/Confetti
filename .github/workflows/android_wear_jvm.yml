name: Android, Wear and JVM CI

on:
  pull_request:
  # Also run on main so this job SEEDS the BuildFetch remote cache with the debug-variant task
  # outputs. Without a main-branch writer building assembleDebug/testDebugUnitTest, PR runs of the
  # same target can only reuse whatever overlaps with the release build that publish-android seeds,
  # capping the hit rate. Running here on main pushes the debug tasks so PRs hit them.
  push:
    branches: [main]

# Cancel superseded PR runs; never cancel the main-branch seeding run.
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # BuildFetch remote cache (see settings.gradle.kts). On main-branch pushes this job is a
      # writer: ON_CI=true + the read-write token seed the debug-variant task outputs so PR runs of
      # this same target get cache hits. On PRs it uses the read-only token with ON_CI=false, so it
      # only reads. Absent on fork PRs, which disables the cache there.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'

    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Wear Unit Tests
      run: ./gradlew :androidApp:testDebugUnitTest :wearApp:testDebugUnitTest

    - name: Build
      run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

  # Launch the app on an emulator and run the Maestro flow shared with the iOS app
  maestro:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Read-only BuildFetch remote cache (see build-android): this job only reads, on main too,
      # so it never changes what the cache is seeded with.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'

    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    # Without this the runner user can't open /dev/kvm, so the emulator falls back to
    # unaccelerated software emulation, which is slow and flaky (APK installs time out).
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build android app
      run: ./gradlew :androidApp:assembleDebug

    - name: Install Maestro
      run: |
        curl -fsSL "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      env:
        MAESTRO_VERSION: 2.11.0

    - name: Run Maestro tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 32
        arch: x86_64
        profile: Nexus 6
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          adb install androidApp/build/outputs/apk/debug/androidApp-debug.apk
          maestro test --debug-output maestro-debug -e APP_ID=dev.johnoreilly.confetti maestro/Confetti.flow

    # takeScreenshot output: Maestro saves it under --debug-output's hidden .maestro directory
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: maestro-screenshot-android
        path: maestro-debug/**/takeScreenshot/*.png
        include-hidden-files: true

    # Maestro's logs, screenshots and view hierarchy, to diagnose failures
    # (Maestro writes under a hidden .maestro directory, hence include-hidden-files)
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: maestro-debug-android
        path: maestro-debug
        include-hidden-files: true

  build-jvm:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # See build-android: writer (RW token + ON_CI) on main to seed :shared JVM task outputs,
      # read-only (RO token) on PRs.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew :shared:runJvmMain
