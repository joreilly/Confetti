name: Compose Preview

# Per-PR Compose @Preview visual diff + baseline maintenance, driven by the
# shared compose-ai-tools `apply` action:
#   * push to main         -> render + push baseline branches (compose-preview/*)
#   * pull_request         -> render PR head, diff vs baseline, sticky PR comment
#   * workflow_dispatch     -> manual run
#
# Two parallel jobs (compose+resources / a11y) push to disjoint baseline/PR
# branches and post disjoint sticky comments, so wall time is the slower render
# rather than the sum. Notifications are skipped (Confetti has no notification
# previews).
#
# Fork PRs use an explicit two-workflow handoff. This workflow renders their
# untrusted code with a read-only token and uploads data-only artifacts. The
# trusted Compose Preview Publish workflow consumes those artifacts without
# executing fork code, pushes the render branches, and posts sticky comments.

# `paths-ignore` keeps the two 45-minute render jobs off changes that cannot
# reach a Compose @Preview: the GraphQL/Ktor backend, the iOS app, the landing
# page, and docs. Deliberately a denylist rather than an allowlist of UI paths
# — previews render against shared Kotlin Multiplatform code and the version
# catalog, so an allowlist would silently stop rendering the first time a
# preview picked up a new transitive dependency. Note this does NOT cover
# dependency bumps that touch `gradle/libs.versions.toml`, even backend-only
# ones; those still render everything.
#
# The list is repeated rather than shared via a YAML anchor because GitHub
# Actions does not support anchors/aliases in workflow files — keep the two
# copies in sync.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'iosApp/**'
      - 'landing-page/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'backend/**'
      - 'iosApp/**'
      - 'landing-page/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    # Trusted path: same-repository PRs and baseline runs publish inline.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      # BuildFetch remote cache (see settings.gradle.kts). On main-branch runs ON_CI=true and the RW
      # token seed the cache from the render/compile task outputs; on PRs ON_CI is false so the same
      # token is used read-only. Absent on forks, which disables the cache there.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: 'true'
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Warm Gradle wrapper
        run: ./gradlew help
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.61.2
        with:
          # Pin the render CLI to the applied Gradle plugin version (single
          # source of truth: composeai-preview in gradle/libs.versions.toml)
          # instead of the action's `latest` default, so the CLI and plugin
          # stay lockstep and preview discovery doesn't break on a minor skew.
          cli-version: catalog
          catalog-key: composeai-preview
          missing-renders: warn
          # Compose @Preview diffs only. The resources pipeline
          # (composePreviewRenderAndroidResources) hard-fails rasterising
          # wearApp's adaptive launcher icons / vector drawables, which isn't
          # what this check is for; a11y runs as its own job below.
          only: compose

  a11y:
    name: A11y previews
    # Trusted path: same-repository PRs and baseline runs publish inline.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      # BuildFetch remote cache (see settings.gradle.kts). On main-branch runs ON_CI=true and the RW
      # token seed the cache from the render/compile task outputs; on PRs ON_CI is false so the same
      # token is used read-only. Absent on forks, which disables the cache there.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: 'true'
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Warm Gradle wrapper
        run: ./gradlew help
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.61.2
        with:
          cli-version: catalog
          catalog-key: composeai-preview
          missing-renders: warn
          only: a11y

  render-fork:
    name: Render previews (fork handoff)
    # Keep this separate from the write-scoped job above. Some organizations
    # allow write tokens for fork workflows; job-level read permission keeps
    # untrusted Gradle code read-only even under that setting.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ON_CI: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: 'true'
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Warm Gradle wrapper
        run: ./gradlew help
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.61.2
        with:
          phase: render
          handoff-dir: _compose_preview_handoff
          cli-version: catalog
          catalog-key: composeai-preview
          missing-renders: warn
          only: compose
      - uses: actions/upload-artifact@v7
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff/
          if-no-files-found: error
          retention-days: 1

  a11y-fork:
    name: A11y previews (fork handoff)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ON_CI: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: 'true'
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Warm Gradle wrapper
        run: ./gradlew help
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.61.2
        with:
          phase: render
          handoff-dir: _compose_preview_a11y_handoff
          cli-version: catalog
          catalog-key: composeai-preview
          missing-renders: warn
          only: a11y
      - uses: actions/upload-artifact@v7
        with:
          name: compose-preview-a11y-handoff
          path: _compose_preview_a11y_handoff/
          if-no-files-found: error
          retention-days: 1
