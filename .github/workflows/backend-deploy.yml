# Deploys to the backend
name: Backend Deploy

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - 'landing-page/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - ".github/workflows/**"
      - "buildSrc/**"

# Cancel any current or previous job from the same PR
concurrency:
  group: backend-deploy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: github.repository == 'joreilly/Confetti'

    env:
      # BuildFetch remote cache (see settings.gradle.kts). This is a trusted main-branch run, so
      # ON_CI=true and the RW token let it push freshly-executed backend task outputs to the remote,
      # seeding the cache that PR builds read from.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN }}
      ON_CI: ${{ github.ref == 'refs/heads/main' }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3.5.0

    - uses: hashicorp/setup-terraform@v3

    - name: Build
      run: |
        ./gradlew :setupCredentials uploadLandingPage
        ./gradlew :backend:terraform:apply
        ./gradlew :backend:service-graphql:bumpCloudRunRevision
        ./gradlew :backend:service-import:bumpCloudRunRevision
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        FIREBASE_SERVICES_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
        APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
